StylesPath = styles
MinAlertLevel = suggestion
Vocab = Project, Toolkit
Packages = A11y, Diataxis, Harper, \
  https://github.com/ammil-industries/vale-signs-of-ai-writing/releases/latest/download/signs-of-ai-writing.zip

# The per-quadrant Readability styles set Flesch-Kincaid, SMOG, and
# Gunning-Fog targets. Plain.Grade remains the paragraph-level check for
# tools and README.

[tools/**/*.md]
BasedOnStyles = Vale, A11y, Harper, signs-of-ai-writing, Inclusive, Plain

[**/README.md]
BasedOnStyles = Vale, A11y, Harper, signs-of-ai-writing, Inclusive, Plain

[docs/public/tutorials/**/*.md]
BasedOnStyles = Vale, A11y, Harper, signs-of-ai-writing, Inclusive, Plain, Tutorial, TutorialReadability
Tutorial.Steps = NO
Plain.Grade = NO
Plain.SMOG = NO

# Index pages list tutorials; they do not restate a tutorial outcome.
[docs/public/tutorials/**/index.md]
Tutorial.Opening = NO

[docs/public/how-to/**/*.md]
BasedOnStyles = Vale, A11y, Harper, signs-of-ai-writing, Inclusive, Plain, HowTo, HowToReadability
Plain.Grade = NO
Plain.SMOG = NO
# A how-to sequence can be an ordered list, bullet list, headings, tabs, or a
# definition list. Ubuntu uses all of them.
HowTo.Steps = NO

# Index pages list how-to guides; they are not task guides themselves.
[docs/public/how-to/**/index.md]
HowTo.Title = NO

[docs/public/reference/**/*.md]
BasedOnStyles = Vale, A11y, Harper, signs-of-ai-writing, Inclusive, Plain, Reference, ReferenceReadability
Plain.Grade = NO
Plain.SMOG = NO
# A reference page about hardware or requirements may have no code to show.
Reference.Examples = NO

[docs/public/explanation/**/*.md]
BasedOnStyles = Vale, A11y, Harper, signs-of-ai-writing, Inclusive, Plain, Explanation, ExplanationReadability
Plain.Grade = NO
Plain.SMOG = NO
# Ubuntu explanations answer why through mechanism and consequence, not
# through a fixed list of cause words.
Explanation.Why = NO
signs-of-ai-writing.Transitions = NO

# Technical documentation needs passive voice when the actor is unknown or
# irrelevant. The voice guidance covers it; a blanket rule does not.
[*]
signs-of-ai-writing.Passive = NO

# Voice exemplars are reference material, not prose to lint.
[tools/skills/diataxis/voice/**]
BasedOnStyles =
